name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install macOS dependencies
        run: brew install portaudio

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Test Go packages
        run: go test ./...

  # The full module needs CGO (PortAudio, hotkeys), but the Windows-specific
  # transcription runtime code (process lifetime, console, reaper) does not.
  test-windows:
    runs-on: windows-2025
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Vet Windows packages
        run: go vet ./internal/transcribe/... ./internal/system/... ./internal/logger/...

      - name: Test transcription runtime on Windows
        run: go test -count=1 -v ./internal/transcribe/... ./internal/hotkey/... ./internal/models/... ./internal/sounds/... ./internal/overlay/...

      - name: Verify Windows recording folder opens
        env:
          YAP_TEST_NATIVE_REVEAL: '1'
        run: go test -count=1 -v ./internal/system/...
