name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false
        default: 'dev'

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'
  WAILS_VERSION: 'latest'
  WHISPER_CPP_VERSION: 'v1.9.5'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="${INPUT_VERSION}"
            TAG="v${VERSION}"
          fi
          if [[ "${VERSION}" != "dev" && ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install macOS dependencies
        run: |
          brew install portaudio whisper-cpp libomp create-dmg

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build macOS App
        run: |
          wails build -platform darwin/arm64 -o "Yap" -ldflags "-X main.appVersion=${{ needs.prepare.outputs.version }}"

      - name: Bundle macOS runtime libraries
        run: |
          set -euo pipefail
          APP="build/bin/Yap.app"
          mkdir -p "$APP/Contents/Frameworks" "$APP/Contents/Resources/bin" "$APP/Contents/Resources/lib" "$APP/Contents/Resources/libexec"

          cp /opt/homebrew/lib/libportaudio.2.dylib "$APP/Contents/Frameworks/"
          install_name_tool -change "/opt/homebrew/opt/portaudio/lib/libportaudio.2.dylib" \
            "@executable_path/../Frameworks/libportaudio.2.dylib" \
            "$APP/Contents/MacOS/Yap"

          cp /opt/homebrew/bin/whisper-cli /opt/homebrew/bin/whisper-server "$APP/Contents/Resources/bin/"
          chmod +x "$APP/Contents/Resources/bin/whisper-cli" "$APP/Contents/Resources/bin/whisper-server"

          # Homebrew renamed whisper-cpp to whisper.cpp; resolve the prefix instead of hardcoding it.
          WHISPER_PREFIX="$(brew --prefix whisper-cpp)"
          cp -L "$WHISPER_PREFIX"/lib/libwhisper*.dylib "$APP/Contents/Resources/lib/"
          cp -L /opt/homebrew/opt/ggml/lib/libggml*.dylib "$APP/Contents/Resources/lib/"
          cp -L /opt/homebrew/opt/libomp/lib/libomp.dylib "$APP/Contents/Resources/lib/"
          cp -L /opt/homebrew/opt/ggml/libexec/* "$APP/Contents/Resources/libexec/"
          ls "$APP/Contents/Resources/libexec"/libggml-cpu-*.so >/dev/null

          for lib in "$APP/Contents/Resources/lib"/*.dylib; do
            install_name_tool -id "@executable_path/../lib/$(basename "$lib")" "$lib" || true
          done

          for bin in "$APP/Contents/Resources/bin"/* "$APP/Contents/Resources/lib"/*.dylib "$APP/Contents/Resources/libexec"/*; do
            [ -f "$bin" ] || continue
            otool -L "$bin" | awk '/\/opt\/homebrew\/(opt|Cellar)\/(whisper-cpp|whisper\.cpp|ggml|libomp)\// {print $1}' | while read -r dep; do
              base="$(basename "$dep")"
              install_name_tool -change "$dep" "@loader_path/../lib/$base" "$bin" || true
            done
            otool -L "$bin" | awk '/@rpath\/lib(whisper|ggml|omp)/ {print $1}' | while read -r dep; do
              base="$(basename "$dep")"
              install_name_tool -change "$dep" "@loader_path/../lib/$base" "$bin" || true
            done
          done

          echo "Inspecting bundled whisper runtime dependencies"
          for bin in "$APP/Contents/Resources/bin"/* "$APP/Contents/Resources/lib"/*.dylib "$APP/Contents/Resources/libexec"/*; do
            [ -f "$bin" ] || continue
            otool -L "$bin"
            if otool -L "$bin" | grep -E '/opt/homebrew/|/usr/local/|/Users/runner/work/|@rpath/' >/dev/null; then
              echo "Unresolved non-system dependency in $bin"
              exit 1
            fi
          done

          CPU_BRAND="$(sysctl -n machdep.cpu.brand_string || true)"
          case "$CPU_BRAND" in
            *M4*) CPU_BACKEND_NAME="libggml-cpu-apple_m4.so" ;;
            *M2*|*M3*) CPU_BACKEND_NAME="libggml-cpu-apple_m2_m3.so" ;;
            *) CPU_BACKEND_NAME="libggml-cpu-apple_m1.so" ;;
          esac
          CPU_BACKEND="$APP/Contents/Resources/libexec/$CPU_BACKEND_NAME"
          if [ ! -f "$CPU_BACKEND" ]; then
            CPU_BACKEND="$APP/Contents/Resources/libexec/libggml-cpu-apple_m1.so"
          fi

          echo "Smoke testing bundled whisper-cli"
          "$APP/Contents/Resources/bin/whisper-cli" --help >/tmp/yap-whisper-help.txt
          GGML_BACKEND_PATH="$CPU_BACKEND" "$APP/Contents/Resources/bin/whisper-cli" --help >/tmp/yap-whisper-help-with-backend.txt
          GGML_BACKEND_PATH="$CPU_BACKEND" "$APP/Contents/Resources/bin/whisper-server" --help >/tmp/yap-whisper-server-help.txt

          echo "Signing bundled macOS runtime files"
          for bin in "$APP/Contents/Resources/bin"/* "$APP/Contents/Resources/lib"/*.dylib "$APP/Contents/Resources/libexec"/* "$APP/Contents/Frameworks"/*.dylib; do
            [ -f "$bin" ] || continue
            codesign --force --sign - "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done

          codesign --force --sign - "$APP/Contents/MacOS/Yap"
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/Yap"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          GGML_BACKEND_PATH="$CPU_BACKEND" "$APP/Contents/Resources/bin/whisper-cli" --help >/tmp/yap-whisper-help-after-sign.txt

          echo "Bundled runtime dependency audit complete"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Yap" \
            --volicon "build/appicon.icns" \
            --window-pos 200 120 \
            --window-size 600 340 \
            --icon-size 100 \
            --icon "Yap.app" 150 150 \
            --hide-extension "Yap.app" \
            --app-drop-link 450 150 \
            "Yap-${{ needs.prepare.outputs.version }}-macOS.dmg" \
            "build/bin/Yap.app"

          MOUNT_OUTPUT=$(hdiutil attach -readonly -nobrowse "Yap-${{ needs.prepare.outputs.version }}-macOS.dmg")
          MOUNT_DIR=$(printf '%s\n' "$MOUNT_OUTPUT" | awk '/\/Volumes\// {print substr($0, index($0, "/Volumes/")); exit}')
          trap 'hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true' EXIT
          test -d "$MOUNT_DIR/Yap.app"
          test -L "$MOUNT_DIR/Applications"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_DIR/Yap.app"
          hdiutil detach "$MOUNT_DIR"
          trap - EXIT

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Yap-${{ needs.prepare.outputs.version }}-macOS.dmg
          retention-days: 5

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install native dependencies via vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install portaudio:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "CGO_CFLAGS=-IC:/vcpkg/installed/x64-windows/include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:/vcpkg/installed/x64-windows/lib -lportaudio" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:/vcpkg/installed/x64-windows/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "C:/vcpkg/installed/x64-windows/bin" >> $env:GITHUB_PATH

      # The vcpkg whisper-cpp port does not build whisper-cli or whisper-server,
      # so build them from source as self-contained executables.
      # GGML_NATIVE=OFF enables the x86-64-v3 set (AVX2/FMA/F16C/BMI2) in a
      # single static binary. Per-CPU variants (GGML_CPU_ALL_VARIANTS) need
      # GGML_BACKEND_DL and shared libraries, so AVX2 is the documented minimum.
      - name: Build whisper.cpp CLI and server
        run: |
          git clone --depth 1 --branch $env:WHISPER_CPP_VERSION https://github.com/ggml-org/whisper.cpp.git C:\whisper.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S C:\whisper.cpp -B C:\whisper.cpp\build `
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=ON -DWHISPER_SDL2=OFF `
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build C:\whisper.cpp\build --config Release --target whisper-cli whisper-server -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Copy Windows runtime dependencies
        run: |
          New-Item -ItemType Directory -Force -Path "build\bin\bin"
          $ErrorActionPreference = "Stop"
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\portaudio.dll" -Destination "build\bin\"
          Copy-Item "C:\whisper.cpp\build\bin\Release\whisper-cli.exe" -Destination "build\bin\bin\"
          Copy-Item "C:\whisper.cpp\build\bin\Release\whisper-server.exe" -Destination "build\bin\bin\"
          foreach ($exe in "whisper-cli.exe", "whisper-server.exe") {
            & "build\bin\bin\$exe" --help *> $null
            if ($LASTEXITCODE -ne 0) { throw "$exe failed to start (exit $LASTEXITCODE)" }
          }

      - name: Cache Whisper smoke-test model
        uses: actions/cache@v4
        with:
          path: C:\yap-models\ggml-tiny.en.bin
          key: whisper-model-ggml-tiny.en-c78c86eb

      - name: Download Whisper smoke-test model
        run: |
          $model = "C:\yap-models\ggml-tiny.en.bin"
          if (-not (Test-Path $model)) {
            New-Item -ItemType Directory -Force -Path "C:\yap-models" | Out-Null
            Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -OutFile $model
          }
          $sha1 = (Get-FileHash -Algorithm SHA1 $model).Hash.ToLower()
          if ($sha1 -ne "c78c86eb1a8faa21b369bcd33207cc90d64ae9df") {
            Remove-Item $model
            throw "ggml-tiny.en.bin checksum mismatch: $sha1"
          }

      # Mirrors the requests Yap makes: whisper-cli fallback and the loopback
      # whisper-server worker (see internal/transcribe/whisper_worker.go).
      - name: Smoke test whisper.cpp transcription
        run: |
          $bin = (Resolve-Path "build\bin\bin").Path
          $model = "C:\yap-models\ggml-tiny.en.bin"
          $wav = "C:\whisper.cpp\samples\jfk.wav"

          $cliText = (& "$bin\whisper-cli.exe" -m $model -f $wav --no-timestamps 2>$null) -join " "
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli failed (exit $LASTEXITCODE)" }
          Write-Host "whisper-cli transcript: $cliText"
          if ($cliText -notmatch "country") { throw "unexpected whisper-cli transcript" }

          $probe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $probe.Start(); $port = $probe.LocalEndpoint.Port; $probe.Stop()
          $base = "http://127.0.0.1:$port/yap-$([guid]::NewGuid().ToString('N'))"
          $serverLog = Join-Path $env:RUNNER_TEMP "whisper-server.log"
          $server = Start-Process -FilePath "$bin\whisper-server.exe" -PassThru -NoNewWindow `
            -ArgumentList @("-m", $model, "--host", "127.0.0.1", "--port", "$port", "--request-path", ([uri]$base).AbsolutePath, "--inference-path", "/inference", "--no-timestamps") `
            -RedirectStandardError $serverLog -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "whisper-server.out")
          try {
            $ready = $false
            for ($i = 0; $i -lt 240 -and -not $ready; $i++) {
              if ($server.HasExited) { throw "whisper-server exited (code $($server.ExitCode))" }
              try {
                $response = Invoke-WebRequest -Uri "$base/" -UseBasicParsing -TimeoutSec 2
                $ready = [bool]($response.Headers["Server"] -eq "whisper.cpp")
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw "whisper-server did not become ready" }

            $listeners = @(Get-NetTCPConnection -State Listen -OwningProcess $server.Id)
            $listeners | Format-Table LocalAddress, LocalPort | Out-String | Write-Host
            if ($listeners.Count -eq 0 -or ($listeners | Where-Object { $_.LocalAddress -ne "127.0.0.1" })) {
              throw "whisper-server must listen on 127.0.0.1 only"
            }

            $serverText = (& curl.exe -sS --fail -F "file=@$wav" -F "response_format=text" -F "no_timestamps=true" "$base/inference") -join " "
            if ($LASTEXITCODE -ne 0) { throw "whisper-server inference failed (exit $LASTEXITCODE)" }
            Write-Host "whisper-server transcript: $serverText"
            if ($serverText -notmatch "country") { throw "unexpected whisper-server transcript" }
          } catch {
            Get-Content $serverLog -Tail 40 -ErrorAction SilentlyContinue
            throw
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows App
        run: |
          wails build -platform windows/amd64 -nsis -o "Yap.exe" -ldflags "-X main.appVersion=${{ needs.prepare.outputs.version }}"
        env:
          CGO_ENABLED: 1

      - name: Ensure runtime files are next to Windows app
        run: |
          New-Item -ItemType Directory -Force -Path "build\bin\bin"
          if (Test-Path "build\bin\Yap") {
            Copy-Item "build\bin\bin" -Destination "build\bin\Yap\bin" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "portable"
          Copy-Item "build\bin\Yap.exe" -Destination "portable\"
          Copy-Item "build\bin\portaudio.dll" -Destination "portable\" -ErrorAction SilentlyContinue
          Copy-Item "build\bin\bin" -Destination "portable\bin" -Recurse -Force
          foreach ($exe in "whisper-cli.exe", "whisper-server.exe") {
            if (-not (Test-Path "portable\bin\$exe")) { throw "portable build is missing $exe" }
          }
          Compress-Archive -Path "portable\*" -DestinationPath "Yap-${{ needs.prepare.outputs.version }}-Windows-Portable.zip" -Force

      - name: Rename installer
        run: |
          Move-Item -Path "build\bin\Yap-amd64-installer.exe" -Destination "Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe" -ErrorAction SilentlyContinue
          if (-not (Test-Path "Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe")) {
            Get-ChildItem -Path "build\bin" -Filter "*installer*.exe" | ForEach-Object {
              Move-Item -Path $_.FullName -Destination "Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe"
            }
          }

      # Runs Yap's own transcription code (internal/transcribe) from the
      # installed and portable layouts, so runtime discovery via <exeDir>\bin,
      # the loopback worker, the whisper-cli fallback, and cleanup are checked
      # against the real packaged binaries.
      - name: Verify packaged transcription runtime
        env:
          CGO_ENABLED: '0'
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $harnessExe = Join-Path $env:RUNNER_TEMP "transcribe.test.exe"
          go test -c -o $harnessExe ./internal/transcribe
          if ($LASTEXITCODE -ne 0) { throw "failed to build transcription harness" }

          $portableDir = "C:\yap-portable"
          Expand-Archive -Path "Yap-$version-Windows-Portable.zip" -DestinationPath $portableDir -Force

          $installer = Start-Process -FilePath (Resolve-Path "Yap-$version-Windows-Setup.exe").Path -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "installer failed (exit $($installer.ExitCode))" }
          $installDir = "C:\Program Files\Applause Lab\Yap"

          $env:YAP_TEST_WHISPER_WAV = "C:\whisper.cpp\samples\jfk.wav"
          $env:YAP_TEST_WHISPER_MODEL = "tiny.en"
          $env:YAP_TEST_EXPECT_TEXT = "country"
          foreach ($layout in @(@{ Name = "portable"; Dir = $portableDir }, @{ Name = "installed"; Dir = $installDir })) {
            foreach ($file in "Yap.exe", "portaudio.dll", "bin\whisper-cli.exe", "bin\whisper-server.exe") {
              if (-not (Test-Path (Join-Path $layout.Dir $file))) { throw "$($layout.Name) layout is missing $file" }
            }
            $models = Join-Path $env:RUNNER_TEMP "yap-models-$($layout.Name)"
            New-Item -ItemType Directory -Force -Path $models | Out-Null
            Copy-Item "C:\yap-models\ggml-tiny.en.bin" $models
            $env:YAP_TEST_WHISPER_MODELS_DIR = $models
            $harness = Join-Path $layout.Dir "transcribe.test.exe"
            Copy-Item $harnessExe $harness
            try {
              foreach ($mode in @(@{ Server = $null; Backend = "cpu-worker" }, @{ Server = "disabled"; Backend = "whisper-cli" })) {
                Write-Host "== $($layout.Name) layout, expected backend $($mode.Backend)"
                if ($mode.Server) { $env:YAP_TEST_WHISPER_SERVER = $mode.Server } else { Remove-Item Env:YAP_TEST_WHISPER_SERVER -ErrorAction SilentlyContinue }
                $env:YAP_TEST_EXPECT_BACKEND = $mode.Backend
                & $harness "-test.run=^TestLocalEngine(TranscribeWAVReturnsTranscriptOnly|LeavesNoWorkerOrTempFiles)$" -test.v -test.count=1
                if ($LASTEXITCODE -ne 0) { throw "transcription harness failed: $($layout.Name) $($mode.Backend)" }
              }
            } finally {
              Remove-Item $harness -Force -ErrorAction SilentlyContinue
            }
          }

          $leftover = @(Get-Process -Name whisper-server, whisper-cli -ErrorAction SilentlyContinue)
          if ($leftover.Count -gt 0) {
            $leftover | Format-Table Id, Path | Out-String | Write-Host
            throw "whisper processes left running after the harness"
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe
          retention-days: 5

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: Yap-${{ needs.prepare.outputs.version }}-Windows-Portable.zip
          retention-days: 5

  build-linux-ubuntu22:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev portaudio19-dev pkg-config libfuse2 fuse cmake git build-essential patchelf

      - name: Build whisper.cpp CLI
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF
          cmake --build /tmp/whisper.cpp/build --config Release --target whisper-cli whisper-server -j2

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Linux App
        run: |
          wails build -platform linux/amd64 -o "yap" -ldflags "-X main.appVersion=${{ needs.prepare.outputs.version }}"

      - name: Create AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/yap AppDir/usr/bin/
          cp /tmp/whisper.cpp/build/bin/whisper-cli AppDir/usr/bin/
          cp /tmp/whisper.cpp/build/bin/whisper-server AppDir/usr/bin/
          chmod +x AppDir/usr/bin/yap AppDir/usr/bin/whisper-cli AppDir/usr/bin/whisper-server
          cp /usr/lib/x86_64-linux-gnu/libportaudio.so.2 AppDir/usr/lib/
          for bin in AppDir/usr/bin/whisper-cli AppDir/usr/bin/whisper-server; do
            ldd "$bin" | awk '/=> \/.*(whisper|ggml|gomp|openblas|blas)/ {print $3}' | xargs -r -I{} cp -L {} AppDir/usr/lib/
          done
          cat > AppDir/usr/share/applications/yap.desktop << EOF
          [Desktop Entry]
          Name=Yap
          Comment=Speech-to-Text Desktop App
          Exec=yap
          Icon=yap
          Type=Application
          Categories=Utility;Audio;
          EOF
          cp build/appicon.iconset/icon_256x256.png AppDir/usr/share/icons/hicolor/256x256/apps/yap.png
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/yap" "$@"
          EOF
          chmod +x AppDir/AppRun
          ln -sf usr/share/applications/yap.desktop AppDir/yap.desktop
          ln -sf usr/share/icons/hicolor/256x256/apps/yap.png AppDir/yap.png
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir "Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.AppImage"

      - name: Create DEB package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Debian versions must start with a digit; build-only runs use "dev".
          [[ "${VERSION}" =~ ^[0-9] ]] || VERSION="0.0.0~${VERSION}"
          PKG_NAME="yap_${VERSION}_amd64"
          mkdir -p "${PKG_NAME}/DEBIAN" "${PKG_NAME}/usr/bin" "${PKG_NAME}/usr/lib/yap" "${PKG_NAME}/usr/share/applications" "${PKG_NAME}/usr/share/icons/hicolor/256x256/apps"
          cp build/bin/yap "${PKG_NAME}/usr/bin/"
          cp /tmp/whisper.cpp/build/bin/whisper-cli "${PKG_NAME}/usr/bin/"
          cp /tmp/whisper.cpp/build/bin/whisper-server "${PKG_NAME}/usr/bin/"
          chmod +x "${PKG_NAME}/usr/bin/yap" "${PKG_NAME}/usr/bin/whisper-cli" "${PKG_NAME}/usr/bin/whisper-server"
          for bin in "${PKG_NAME}/usr/bin/whisper-cli" "${PKG_NAME}/usr/bin/whisper-server"; do
            ldd "$bin" | awk '/=> \/.*(whisper|ggml|gomp|openblas|blas)/ {print $3}' | xargs -r -I{} cp -L {} "${PKG_NAME}/usr/lib/yap/"
            patchelf --set-rpath '$ORIGIN/../lib/yap' "$bin"
          done
          for lib in "${PKG_NAME}/usr/lib/yap"/*; do
            if [ -f "$lib" ]; then patchelf --set-rpath '$ORIGIN' "$lib"; fi
          done
          cp build/appicon.iconset/icon_256x256.png "${PKG_NAME}/usr/share/icons/hicolor/256x256/apps/yap.png"
          cat > "${PKG_NAME}/usr/share/applications/yap.desktop" << EOF
          [Desktop Entry]
          Name=Yap
          Comment=Speech-to-Text Desktop App by applauselab.ai
          Exec=/usr/bin/yap
          Icon=yap
          Type=Application
          Categories=Utility;Audio;
          EOF
          cat > "${PKG_NAME}/DEBIAN/control" << EOF
          Package: yap
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.0-37, libportaudio2, libgomp1
          Maintainer: Applause Lab <hello@applauselab.ai>
          Description: Speech-to-Text Desktop App
           Yap is a speech-to-text desktop application powered by Whisper.
          EOF
          dpkg-deb --build "${PKG_NAME}"
          mv "${PKG_NAME}.deb" "Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.deb"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-ubuntu22
          path: Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.AppImage
          retention-days: 5

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-ubuntu22
          path: Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.deb
          retention-days: 5

  build-linux-ubuntu24:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev portaudio19-dev pkg-config libfuse2 cmake git build-essential patchelf

      - name: Build whisper.cpp CLI
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF
          cmake --build /tmp/whisper.cpp/build --config Release --target whisper-cli whisper-server -j2

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Linux App
        run: |
          wails build -platform linux/amd64 -o "yap" -tags webkit2_41 -ldflags "-X main.appVersion=${{ needs.prepare.outputs.version }}"

      - name: Create AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/yap AppDir/usr/bin/
          cp /tmp/whisper.cpp/build/bin/whisper-cli AppDir/usr/bin/
          cp /tmp/whisper.cpp/build/bin/whisper-server AppDir/usr/bin/
          chmod +x AppDir/usr/bin/yap AppDir/usr/bin/whisper-cli AppDir/usr/bin/whisper-server
          cp /usr/lib/x86_64-linux-gnu/libportaudio.so.2 AppDir/usr/lib/
          for bin in AppDir/usr/bin/whisper-cli AppDir/usr/bin/whisper-server; do
            ldd "$bin" | awk '/=> \/.*(whisper|ggml|gomp|openblas|blas)/ {print $3}' | xargs -r -I{} cp -L {} AppDir/usr/lib/
          done
          cat > AppDir/usr/share/applications/yap.desktop << EOF
          [Desktop Entry]
          Name=Yap
          Comment=Speech-to-Text Desktop App
          Exec=yap
          Icon=yap
          Type=Application
          Categories=Utility;Audio;
          EOF
          cp build/appicon.iconset/icon_256x256.png AppDir/usr/share/icons/hicolor/256x256/apps/yap.png
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/yap" "$@"
          EOF
          chmod +x AppDir/AppRun
          ln -sf usr/share/applications/yap.desktop AppDir/yap.desktop
          ln -sf usr/share/icons/hicolor/256x256/apps/yap.png AppDir/yap.png
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.AppImage"

      - name: Create DEB package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Debian versions must start with a digit; build-only runs use "dev".
          [[ "${VERSION}" =~ ^[0-9] ]] || VERSION="0.0.0~${VERSION}"
          PKG_NAME="yap_${VERSION}_amd64"
          mkdir -p "${PKG_NAME}/DEBIAN" "${PKG_NAME}/usr/bin" "${PKG_NAME}/usr/lib/yap" "${PKG_NAME}/usr/share/applications" "${PKG_NAME}/usr/share/icons/hicolor/256x256/apps"
          cp build/bin/yap "${PKG_NAME}/usr/bin/"
          cp /tmp/whisper.cpp/build/bin/whisper-cli "${PKG_NAME}/usr/bin/"
          cp /tmp/whisper.cpp/build/bin/whisper-server "${PKG_NAME}/usr/bin/"
          chmod +x "${PKG_NAME}/usr/bin/yap" "${PKG_NAME}/usr/bin/whisper-cli" "${PKG_NAME}/usr/bin/whisper-server"
          for bin in "${PKG_NAME}/usr/bin/whisper-cli" "${PKG_NAME}/usr/bin/whisper-server"; do
            ldd "$bin" | awk '/=> \/.*(whisper|ggml|gomp|openblas|blas)/ {print $3}' | xargs -r -I{} cp -L {} "${PKG_NAME}/usr/lib/yap/"
            patchelf --set-rpath '$ORIGIN/../lib/yap' "$bin"
          done
          for lib in "${PKG_NAME}/usr/lib/yap"/*; do
            if [ -f "$lib" ]; then patchelf --set-rpath '$ORIGIN' "$lib"; fi
          done
          cp build/appicon.iconset/icon_256x256.png "${PKG_NAME}/usr/share/icons/hicolor/256x256/apps/yap.png"
          cat > "${PKG_NAME}/usr/share/applications/yap.desktop" << EOF
          [Desktop Entry]
          Name=Yap
          Comment=Speech-to-Text Desktop App by applauselab.ai
          Exec=/usr/bin/yap
          Icon=yap
          Type=Application
          Categories=Utility;Audio;
          EOF
          cat > "${PKG_NAME}/DEBIAN/control" << EOF
          Package: yap
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libportaudio2, libgomp1
          Maintainer: Applause Lab <hello@applauselab.ai>
          Description: Speech-to-Text Desktop App
           Yap is a speech-to-text desktop application powered by Whisper.
          EOF
          dpkg-deb --build "${PKG_NAME}"
          mv "${PKG_NAME}.deb" "Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.deb"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-ubuntu24
          path: Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.AppImage
          retention-days: 5

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-ubuntu24
          path: Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.deb
          retention-days: 5

  release:
    needs: [prepare, build-macos, build-windows, build-linux-ubuntu22, build-linux-ubuntu24]
    # Manual runs without a version only build and upload workflow artifacts.
    if: needs.prepare.outputs.version != 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*" | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Yap ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'dev') || contains(needs.prepare.outputs.version, 'beta') || contains(needs.prepare.outputs.version, 'alpha') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-installer/*.exe
            artifacts/windows-portable/*.zip
            artifacts/linux-appimage-ubuntu22/*.AppImage
            artifacts/linux-deb-ubuntu22/*.deb
            artifacts/linux-appimage-ubuntu24/*.AppImage
            artifacts/linux-deb-ubuntu24/*.deb
          body: |
            ## Yap ${{ needs.prepare.outputs.version }}

            Speech-to-Text Desktop App by [Applause Lab](https://applauselab.ai)

            Local transcription runtimes (`whisper-server` with `whisper-cli` fallback) are bundled with release artifacts. Whisper model files are still downloaded on first setup into the user's Yap data directory.

            ### Downloads

            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon) | `Yap-${{ needs.prepare.outputs.version }}-macOS.dmg` |
            | Windows Installer | `Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe` |
            | Windows Portable | `Yap-${{ needs.prepare.outputs.version }}-Windows-Portable.zip` |
            | Linux (Ubuntu 22.04, Debian 11/12) | `Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.AppImage` or `.deb` |
            | Linux (Ubuntu 24.04+) | `Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.AppImage` or `.deb` |

            ### Installation

            **macOS:** Open the DMG, drag to Applications folder
            **Windows:** Run the installer
            **Linux (AppImage):** `chmod +x *.AppImage && ./Yap-*.AppImage`
            **Linux (DEB):** `sudo apt install ./Yap-*.deb`
